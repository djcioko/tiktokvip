<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magaro Wall Center Focus</title>
    <style>
        :root { --bg-color: #00FF00; --cube-bg: #ffffff; --text-color: #000000; }
        body { margin: 0; background-color: var(--bg-color); font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; }
        
        #admin-panel { 
            background: rgba(0, 0, 0, 0.95); color: white; padding: 15px; 
            display: flex; gap: 15px; flex-wrap: wrap; position: relative; z-index: 9999;
            border-bottom: 4px solid gold; align-items: center;
        }

        .cube {
            width: 300px; height: 400px; 
            background: var(--cube-bg); color: var(--text-color);
            position: absolute; cursor: move; border-radius: 25px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); user-select: none;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Tranzitie lina pentru centrare */
            overflow: hidden; border: 6px solid #fff;
            resize: both; 
        }

        /* Stil pentru cand cubul este pe mijloc */
        .cube.centered {
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(1.8) !important;
            z-index: 9999 !important;
            border-color: gold;
            box-shadow: 0 0 100px rgba(255, 215, 0, 1);
        }

        .cube img { width: 100%; height: 75%; object-fit: cover; pointer-events: none; border-bottom: 5px solid #eee; }
        .cube .name { font-size: 2rem; font-weight: 900; margin-top: 10px; text-transform: uppercase; text-align: center; }
        
        .badge { background: gold; color: black; padding: 5px 15px; border-radius: 10px; font-size: 0.9rem; margin-top: 5px; font-weight: bold; }
        .hidden { display: none !important; }
        .controls-toggle { position: fixed; top: 10px; right: 10px; z-index: 10000; background: gold; border: none; padding: 10px; border-radius: 50%; cursor: pointer; }
        input, select, button { padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<button class="controls-toggle" onclick="toggleAdmin()">⚙️</button>

<div id="admin-panel">
    <input type="text" id="userName" placeholder="Nume...">
    <input type="text" id="userImg" placeholder="Link Poza">
    <label style="background: #333; padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid gold;">
        📁 Upload
        <input type="file" id="userFile" accept="image/*" style="display:none" onchange="handleFileUpload(this)">
    </label>
    <input type="hidden" id="tempImgData">
    <select id="userRole">
        <option value="none">Simplu</option>
        <option value="vip">⭐ VIP</option>
        <option value="top">🔥 TOP</option>
    </select>
    <input type="text" id="customKey" style="width: 50px;" placeholder="Tasta">
    <button onclick="addCube()" style="background: #28a745; color: white;">ADĂUGĂ</button>
    <button onclick="clearWall()" style="background: #dc3545; color: white;">GOLIRE</button>
    <input type="color" id="bgColor" value="#00FF00" onchange="updateColors()">
</div>

<div id="wall-container" style="position: relative; width: 100%; height: 100vh;"></div>

<script>
    let keyMap = {};

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === "INPUT") {
            if (e.key === "Enter") addCube();
            return;
        }
        const key = e.key.toLowerCase();
        if (keyMap[key]) {
            const el = document.getElementById(keyMap[key]);
            // Toggle clasa centered - il duce pe mijloc sau il lasa la locul lui
            el.classList.toggle('centered');
        }
    });

    function handleFileUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('tempImgData').value = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function addCube() {
        const name = document.getElementById('userName').value;
        const imgLink = document.getElementById('userImg').value;
        const imgUpload = document.getElementById('tempImgData').value;
        const role = document.getElementById('userRole').value;
        const tasta = document.getElementById('customKey').value.toLowerCase();

        if(!name) return;

        const imgToUse = imgUpload || imgLink || 'https://via.placeholder.com/300';
        const cubeId = 'cube-' + Date.now();
        const div = document.createElement('div');
        div.className = 'cube';
        div.id = cubeId;
        div.style.left = '50px';
        div.style.top = '180px';
        
        if (tasta) keyMap[tasta] = cubeId;

        div.innerHTML = `
            <img src="${imgToUse}">
            <div class="name">${name}</div>
            ${role !== 'none' ? `<div class="badge">${role.toUpperCase()}</div>` : ''}
        `;

        // DRAG LOGIC (se dezactiveaza cand e centrat ca sa nu il strici din gresala)
        div.onmousedown = function(e) {
            if (div.classList.contains('centered')) return; 
            if (e.target.className.includes('cube')) {
                let shiftX = e.clientX - div.getBoundingClientRect().left;
                let shiftY = e.clientY - div.getBoundingClientRect().top;
                function moveAt(pageX, pageY) {
                    div.style.left = pageX - shiftX + 'px';
                    div.style.top = pageY - shiftY + 'px';
                }
                function onMouseMove(e) { moveAt(e.pageX, e.pageY); }
                document.addEventListener('mousemove', onMouseMove);
                document.onmouseup = () => document.removeEventListener('mousemove', onMouseMove);
            }
        };

        document.getElementById('wall-container').appendChild(div);
        document.getElementById('userName').value = '';
        document.getElementById('userImg').value = '';
        document.getElementById('tempImgData').value = '';
        document.getElementById('customKey').value = '';
    }

    function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
    function clearWall() { document.getElementById('wall-container').innerHTML = ''; keyMap = {}; }
    function updateColors() { document.body.style.backgroundColor = document.getElementById('bgColor').value; }
</script>
</body>
</html>
