<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wall Interactiv - Magaro</title>
    <style>
        :root { --bg-color: #00FF00; --cube-bg: #ffffff; --text-color: #000000; }
        body { margin: 0; background-color: var(--bg-color); font-family: sans-serif; overflow: hidden; height: 100vh; }
        
        #admin-panel { 
            background: rgba(0,0,0,0.9); color: white; padding: 10px; 
            display: flex; gap: 10px; flex-wrap: wrap; position: relative; z-index: 9999;
        }

        .cube {
            width: 150px; height: 150px; background: var(--cube-bg); color: var(--text-color);
            position: absolute; cursor: move; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); user-select: none;
            transition: transform 0.2s;
        }

        .cube img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 5px; pointer-events: none; }
        .cube .name { font-weight: bold; pointer-events: none; }
        .cube.focused { transform: scale(2) !important; z-index: 1000 !important; border: 3px solid gold; }

        .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 5px; margin-top: 5px; font-weight: bold; }
        .badge-vip { background: gold; color: black; }

        .hidden { display: none !important; }
        .controls-toggle { position: fixed; bottom: 10px; right: 10px; z-index: 10000; }
    </style>
</head>
<body>

<button class="controls-toggle" onclick="toggleAdmin()">⚙️</button>

<div id="admin-panel">
    <input type="text" id="userName" placeholder="Nume...">
    <input type="text" id="userImg" placeholder="Paste Link Poza (Click dreapta -> Copy Image Address)">
    <select id="userRole">
        <option value="none">Simplu</option>
        <option value="vip">⭐ VIP</option>
        <option value="top">🔥 TOP</option>
    </select>
    <button onclick="addCube()" style="background: green; color: white;">ADĂUGĂ (Tasta Enter)</button>
    <button onclick="clearWall()">Golește</button>
    <input type="color" id="bgColor" value="#00FF00" onchange="updateColors()">
</div>

<div id="wall-container" style="position: relative; width: 100%; height: 100vh;"></div>

<script>
    let activeCube = null;

    // Detectare taste
    document.addEventListener('keydown', (e) => {
        if(e.key === "Enter" && document.activeElement.tagName !== "BUTTON") addCube();
        if(e.key === "f" || e.key === "F") { // Tasta F pentru focus pe ultimul cub
            const cubes = document.querySelectorAll('.cube');
            if(cubes.length > 0) cubes[cubes.length-1].classList.toggle('focused');
        }
    });

    function addCube() {
        const name = document.getElementById('userName').value;
        const img = document.getElementById('userImg').value || 'https://via.placeholder.com/60';
        const role = document.getElementById('userRole').value;
        if(!name) return;

        const wall = document.getElementById('wall-container');
        const div = document.createElement('div');
        div.className = 'cube';
        div.style.left = '100px';
        div.style.top = '150px';
        
        div.innerHTML = `
            <img src="${img}">
            <div class="name">${name}</div>
            ${role !== 'none' ? `<div class="badge badge-${role}">${role.toUpperCase()}</div>` : ''}
        `;

        // DRAG AND DROP LOGIC
        div.onmousedown = dragMouseDown;

        wall.appendChild(div);
        document.getElementById('userName').value = '';
        document.getElementById('userImg').value = '';
    }

    function dragMouseDown(e) {
        activeCube = e.target;
        document.onmousemove = elementDrag;
        document.onmouseup = () => { document.onmousemove = null; };
    }

    function elementDrag(e) {
        if (!activeCube) return;
        activeCube.style.top = (e.clientY - 75) + "px";
        activeCube.style.left = (e.clientX - 75) + "px";
    }

    function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
    function clearWall() { document.getElementById('wall-container').innerHTML = ''; }
    function updateColors() { document.body.style.backgroundColor = document.getElementById('bgColor').value; }
</script>
</body>
</html>
