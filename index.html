<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magaro Wall VIP - Versiunea Finală Stabilă</title>
    <style>
        :root { --bg-color: #00FF00; --cube-bg: #ffffff; --text-color: #000000; }
        body { margin: 0; background-color: var(--bg-color); font-family: 'Arial Black', sans-serif; overflow: hidden; height: 100vh; }
        
        #admin-panel { 
            background: rgba(0, 0, 0, 0.95); color: white; padding: 15px; 
            display: flex; gap: 15px; flex-wrap: wrap; position: relative; z-index: 9999;
            border-bottom: 4px solid gold; align-items: center;
        }

        .cube {
            width: 300px; height: 400px; 
            background: var(--cube-bg); color: var(--text-color);
            position: absolute; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); user-select: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid #fff;
            
            /* REPARARE RESIZE */
            resize: both; 
            overflow: hidden; 
            min-width: 150px; min-height: 200px;
        }

        /* Indicator vizual pentru Resize (dreapta jos) */
        .cube::after {
            content: ""; position: absolute; bottom: 0; right: 0;
            width: 20px; height: 20px;
            background: linear-gradient(135deg, transparent 50%, #ccc 50%, #ccc 60%, transparent 60%, transparent 70%, #ccc 70%);
            cursor: nwse-resize; z-index: 10;
        }

        .btn-remove {
            position: absolute; top: 5px; right: 5px;
            width: 30px; height: 30px; background: #ff0000; color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; border: 2px solid #fff;
            z-index: 100; font-family: Arial, sans-serif; font-weight: bold;
        }

        .cube.centered {
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) scale(1.6) !important;
            z-index: 9999 !important; border-color: gold;
            box-shadow: 0 0 100px rgba(255, 215, 0, 1);
            resize: none; /* Oprim resize cand e pe mijloc */
        }

        .cube img { width: 100%; height: 75%; object-fit: cover; pointer-events: none; border-bottom: 4px solid #eee; }
        .cube .name { font-size: 1.8rem; font-weight: 900; margin-top: 10px; text-transform: uppercase; text-align: center; width: 100%; pointer-events: none; }
        
        .key-tag { position: absolute; bottom: 5px; left: 10px; font-size: 12px; color: #777; font-family: sans-serif; pointer-events: none; }
        .badge { background: gold; color: black; padding: 4px 12px; border-radius: 8px; font-size: 0.8rem; margin-top: 3px; font-weight: bold; pointer-events: none; }
        
        .hidden { display: none !important; }
        .controls-toggle { position: fixed; top: 10px; right: 10px; z-index: 10000; background: gold; border: none; padding: 10px; border-radius: 50%; cursor: pointer; }
        input, select, button { padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<button class="controls-toggle" onclick="toggleAdmin()">⚙️</button>

<div id="admin-panel">
    <input type="text" id="userName" placeholder="Nume...">
    <input type="text" id="userImg" placeholder="Link Poză">
    <label style="background: #333; padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid gold; color: gold;">
        📁 UPLOAD
        <input type="file" id="userFile" accept="image/*" style="display:none" onchange="handleFileUpload(this)">
    </label>
    <input type="hidden" id="tempImgData">
    <select id="userRole">
        <option value="none">Fără Rol</option>
        <option value="vip">⭐ VIP</option>
        <option value="top">🔥 TOP</option>
    </select>
    <button onclick="addCube()" style="background: #28a745; color: white;">ADĂUGĂ</button>
    <button onclick="clearWall()" style="background: #dc3545; color: white;">GOLIRE</button>
    <input type="color" id="bgColor" value="#00FF00" onchange="updateColors()">
</div>

<div id="wall-container" style="position: relative; width: 100%; height: 100vh;"></div>

<script>
    let keyMap = {};
    const autoKeys = ['1','2','3','4','5','6','7','8','9','0','q','w','e','r','t','y','u','i','o','p','a','s','d','f','g','h','j','k','l'];
    let cubeCount = 0;

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === "INPUT") {
            if (e.key === "Enter") addCube();
            return;
        }
        const key = e.key.toLowerCase();
        if (keyMap[key]) {
            document.getElementById(keyMap[key]).classList.toggle('centered');
        }
    });

    function handleFileUpload(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('tempImgData').value = e.target.result;
            reader.readAsDataURL(input.files[0]);
        }
    }

    function removeCube(e, id, key) {
        e.stopPropagation();
        const el = document.getElementById(id);
        if (el) { el.remove(); delete keyMap[key]; }
    }

    function addCube() {
        const name = document.getElementById('userName').value;
        const imgLink = document.getElementById('userImg').value;
        const imgUpload = document.getElementById('tempImgData').value;
        const role = document.getElementById('userRole').value;
        if(!name) return;

        const assignedKey = autoKeys[cubeCount % autoKeys.length];
        const imgToUse = imgUpload || imgLink || 'https://via.placeholder.com/400';
        const cubeId = 'cube-' + Date.now();
        
        const div = document.createElement('div');
        div.className = 'cube';
        div.id = cubeId;
        div.style.left = (50 + (cubeCount * 15)) + 'px';
        div.style.top = '180px';
        
        keyMap[assignedKey] = cubeId;

        div.innerHTML = `
            <div class="btn-remove" onclick="removeCube(event, '${cubeId}', '${assignedKey}')">✖</div>
            <img src="${imgToUse}">
            <div class="name">${name}</div>
            ${role !== 'none' ? `<div class="badge">${role.toUpperCase()}</div>` : ''}
            <div class="key-tag">Tasta: ${assignedKey}</div>
        `;

        // DRAG LOGIC REPARATĂ: Nu activăm drag-ul dacă mouse-ul e în zona de resize
        div.onmousedown = function(e) {
            if (e.target.className === 'btn-remove') return;
            if (div.classList.contains('centered')) return;
            
            // Detectăm dacă mouse-ul e în colțul dreapta-jos (zona de resize)
            const rect = div.getBoundingClientRect();
            const isInResizeZone = (e.clientX > rect.right - 30 && e.clientY > rect.bottom - 30);
            
            if (isInResizeZone) return; // Lăsăm browser-ul să facă resize

            let shiftX = e.clientX - rect.left;
            let shiftY = e.clientY - rect.top;

            function moveAt(pageX, pageY) {
                div.style.left = pageX - shiftX + 'px';
                div.style.top = pageY - shiftY + 'px';
            }

            function onMouseMove(ev) { moveAt(ev.pageX, ev.pageY); }
            document.addEventListener('mousemove', onMouseMove);
            
            document.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
            };
        };

        div.ondragstart = () => false;
        document.getElementById('wall-container').appendChild(div);
        cubeCount++;
        document.getElementById('userName').value = '';
        document.getElementById('userImg').value = '';
        document.getElementById('tempImgData').value = '';
    }

    function toggleAdmin() { document.getElementById('admin-panel').classList.toggle('hidden'); }
    function clearWall() { if(confirm("Golești tot?")) { document.getElementById('wall-container').innerHTML = ''; keyMap = {}; cubeCount = 0; } }
    function updateColors() { document.body.style.backgroundColor = document.getElementById('bgColor').value; }
</script>
</body>
</html>
